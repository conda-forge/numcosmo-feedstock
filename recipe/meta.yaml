{% set name = "numcosmo" %}
{% set version = "0.28.0" %}
{% set build = 1 %}
{% set sha256 = "4c40fa8cea3ac4a6facfbc1d604123550ff6bd68935a5a5473a9b184253e5066" %}
{% set nonmpi_build = build + 100 %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/NumCosmo/NumCosmo/releases/download/v{{ version }}/numcosmo-{{ version }}.tar.xz
  sha256: {{ sha256 }}

# ensure mpi is defined (needed for conda-smithy recipe-lint)
{% set mpi = mpi or 'nompi' %}

build:
  skip: true  # [py<311 or win or (python_impl=='pypy')]
  number: {{ nonmpi_build }}  # [mpi == "nompi"]
  string: "nompi_h{{ PKG_HASH }}_{{ nonmpi_build }}"  # [mpi == "nompi"]
  number: {{ build }}  # [mpi != "nompi"]
  string: "mpi_{{ mpi }}_h{{ PKG_HASH }}_{{ build }}"  # [mpi != "nompi"]
  run_exports:   # [mpi != "nompi"]
    - {{ name }} * mpi_{{ mpi }}_*                     # [mpi != "nompi"]
  detect_binary_files_with_prefix: true
  ignore_run_exports_from:
    - libfabric-devel

requirements:
  build:
    - python
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - meson
    - ninja
    - pkg-config
    - pip
    - pygobject
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - {{ stdlib('c') }}
    - gobject-introspection
    - {{ mpi }}              # [build_platform != target_platform and mpi != 'nompi']
    - libfabric-devel        # [build_platform != target_platform and mpi != 'nompi']
    - libblas                # [build_platform != target_platform]
    - libcblas               # [build_platform != target_platform]
    - liblapack              # [build_platform != target_platform]
    - glib                   # [build_platform != target_platform]
    - gsl                    # [build_platform != target_platform]
    - gmp                    # [build_platform != target_platform]
    - mpfr                   # [build_platform != target_platform]
    - fftw                   # [build_platform != target_platform]
    - nlopt                  # [build_platform != target_platform]
    - cfitsio                # [build_platform != target_platform]
    - arb                    # [build_platform != target_platform]
    - hdf5                   # [build_platform != target_platform]
    - zlib                   # [build_platform != target_platform]
  host:
    - {{ mpi }}  # [mpi != 'nompi']
    - libfabric-devel  # [mpi != 'nompi']
    - libblas
    - libcblas
    - liblapack
    - glib
    - gsl
    - gmp
    - mpfr
    - fftw
    - nlopt
    - cfitsio
    - arb
    - hdf5
    - python
    - pygobject
    - pygobject-stubs
    - zlib
  run:
    - {{ mpi }}  # [mpi != 'nompi']
    - libcurl
    - fftw
    - nlopt
    - cfitsio
    - pygobject
    - pygobject-stubs
    - gobject-introspection
    - numpy
    - scipy
    - matplotlib-base
    - astropy
    - getdist
    - networkx
    - pydantic
    - tabulate
    - tqdm
    - python
    - rich
    - typer
    - zlib

test:
  requires:
    - pip
    - pygobject
    - openssh  # [mpi == 'openmpi']
  commands:
    - test -f ${PREFIX}/lib/libnumcosmo{{ SHLIB_EXT }}   # [not win]
    - numcosmo --help
    - $PYTHON -c "import numcosmo_py.analysis, numcosmo_py.app, numcosmo_py.catalog, numcosmo_py.ccl, numcosmo_py.datasets, numcosmo_py.experiments, numcosmo_py.external, numcosmo_py.interpolation, numcosmo_py.plotting, numcosmo_py.sampling"
    - $PYTHON -m pip check
    - $PYTHON ${PREFIX}/share/numcosmo-{{ version }}/examples/example_simple.py

about:
  home: https://numcosmo.github.io/
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: 'NumCosmo is a free software C library whose main purposes are to test cosmological models using observational data and to provide a set of tools to perform cosmological calculations.'

extra:
  recipe-maintainers:
    - vitenti
